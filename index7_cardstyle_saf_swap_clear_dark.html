<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routes: Customizable Start and End</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark-mode {
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        #map {
            height: 500px;
            width: 100%;
            border: 1px solid #ccc;
        }
        #directions {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .route-card {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        .dark-mode .route-card {
            background: #2a2a2a;
            border-color: #444;
        }
        .route-card h3 {
            margin: 0 0 10px;
            font-size: 1.2em;
        }
        .route-card p {
            margin: 5px 0;
        }
        .route-card ol {
            margin: 10px 0 0;
            padding-left: 20px;
        }
        .route-card ol li {
            margin-bottom: 5px;
        }
        h1 {
            color: #333;
        }
        .dark-mode h1 {
            color: #e0e0e0;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .dark-mode button {
            background: #0056b3;
        }
        .dark-mode button:hover {
            background: #003d82;
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .controls input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 250px;
            max-width: 100%;
            background: white;
            color: #333;
        }
        .dark-mode .controls input[type="text"] {
            background: #333;
            color: #e0e0e0;
            border-color: #555;
        }
        .swap-button {
            padding: 8px 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .swap-button:hover {
            background: #218838;
        }
        .dark-mode .swap-button {
            background: #218838;
        }
        .dark-mode .swap-button:hover {
            background: #1a6d2e;
        }
        .clear-button {
            background: #dc3545;
        }
        .clear-button:hover {
            background: #b02a37;
        }
        .dark-mode .clear-button {
            background: #b02a37;
        }
        .dark-mode .clear-button:hover {
            background: #911d29;
        }
        label {
            margin-right: 10px;
        }
        .dark-mode label {
            color: #e0e0e0;
        }
        .route-legend {
            margin: 10px 0;
            font-size: 14px;
        }
        .route-legend p {
            margin: 5px 0;
        }
        .route-legend span {
            display: inline-block;
            width: 20px;
            height: 10px;
            margin-right: 5px;
            vertical-align: middle;
        }
        #loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .dark-mode .spinner {
            border: 4px solid #555;
            border-top: 4px solid #0056b3;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .mode-toggle {
            padding: 8px 15px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .mode-toggle:hover {
            background: #5a6268;
        }
        .dark-mode .mode-toggle {
            background: #5a6268;
        }
        .dark-mode .mode-toggle:hover {
            background: #4a5156;
        }
    </style>
</head>
<body>
    <h W1>Custom Routes</h1>
    <div class="controls">
        <div>
            <label for="start">Start:</label>
            <input type="text" id="start" value="24 Michigan Street Lockport, NY" placeholder="Enter start address">
        </div>
        <div>
            <label for="end">End:</label>
            <input type="text" id="end" value="4777 Reiter Road East Aurora, NY 14052" placeholder="Enter end address">
        </div>
        <button class="swap-button" onclick="swapAddresses()">Swap</button>
        <label><input type="checkbox" id="avoidHighways" onchange="getRoutes()"> Avoid Highways</label>
        <button onclick="getRoutes()">Calculate Routes</button>
        <button class="clear-button" onclick="clearRoutes()">Clear Routes</button>
        <button class="mode-toggle" onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </div>
    <div class="route-legend">
        <p><span style="background-color: red;"></span> Shortest Distance</p>
        <p><span style="background-color: yellow;"></span> Alternative Route</p>
        <p><span style="background-color: green;"></span> Fastest Route</p>
    </div>
    <div id="map"></div>
    <div id="directions"></div>
    <div id="loading">
        <div class="spinner"></div>
    </div>

<script>
    let map, directionsService, directionsRenderers = [];

    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 10,
            center: { lat: 43.1706, lng: -78.6903 }
        });
        directionsService = new google.maps.DirectionsService();
        getRoutes();
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
        // Persist dark mode preference (optional)
        localStorage.setItem("darkMode", document.body.classList.contains("dark-mode"));
    }

    // Load dark mode preference on page load (optional)
    window.onload = () => {
        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }
    };

    function swapAddresses() {
        const startInput = document.getElementById("start");
        const endInput = document.getElementById("end");
        const temp = startInput.value;
        startInput.value = endInput.value;
        endInput.value = temp;
        getRoutes();
    }

    function clearRoutes() {
        directionsRenderers.forEach(renderer => renderer.setMap(null));
        directionsRenderers = [];
        document.getElementById("directions").innerHTML = "";
        map.setCenter({ lat: 43.1706, lng: -78.6903 });
        map.setZoom(10);
    }

    function showLoading() {
        document.getElementById("loading").style.display = "flex";
    }

    function hideLoading() {
        document.getElementById("loading").style.display = "none";
    }

    function getRoutes() {
        const start = document.getElementById("start").value.trim();
        const end = document.getElementById("end").value.trim();
        const avoidHighways = document.getElementById("avoidHighways").checked;

        if (!start || !end) {
            alert("Please enter both start and end addresses.");
            return;
        }

        showLoading();

        const request = {
            origin: start,
            destination: end,
            travelMode: google.maps.TravelMode.DRIVING,
            provideRouteAlternatives: true,
            avoidHighways: avoidHighways,
            drivingOptions: {
                departureTime: new Date(),
                trafficModel: "bestguess"
            }
        };

        clearRoutes();

        directionsService.route(request, (result, status) => {
            hideLoading();
            if (status === google.maps.DirectionsStatus.OK) {
                const routes = result.routes;
                if (routes.length === 0) {
                    alert("No routes found.");
                    return;
                }

                let fastestRoute = routes[0];
                let shortestRoute = routes[0];
                let fastestDuration = routes[0].legs[0].duration.value;
                let shortestDistance = routes[0].legs[0].distance.value;

                routes.forEach(route => {
                    const duration = route.legs[0].duration.value;
                    const distance = route.legs[0].distance.value;
                    if (duration < fastestDuration) {
                        fastestRoute = route;
                        fastestDuration = duration;
                    }
                    if (distance < shortestDistance) {
                        shortestRoute = route;
                        shortestDistance = distance;
                    }
                });

                const routeAssignments = [
                    { route: shortestRoute, color: "red", label: "Shortest Distance" },
                    { route: routes.find(r => r !== fastestRoute && r !== shortestRoute) || routes[1] || routes[0], color: "yellow", label: "Alternative Route" },
                    { route: fastestRoute, color: "green", label: "Fastest Route" }
                ];

                routeAssignments.forEach((assignment, index) => {
                    if (!assignment.route) return;
                    const renderer = new google.maps.DirectionsRenderer({
                        map: map,
                        directions: result,
                        routeIndex: routes.indexOf(assignment.route),
                        polylineOptions: {
                            strokeColor: assignment.color,
                            strokeWeight: 5,
                            strokeOpacity: 0.7
                        },
                        suppressMarkers: index !== 0
                    });
                    directionsRenderers.push(renderer);

                    const directionsPanel = document.getElementById("directions");
                    const routeCard = document.createElement("div");
                    routeCard.className = "route-card";
                    routeCard.innerHTML = `<h3 style="color: ${assignment.color}">${assignment.label}</h3>` +
                        `<p>Distance: ${assignment.route.legs[0].distance.text}</p>` +
                        `<p>Duration: ${assignment.route.legs[0].duration.text}</p>` +
                        `<p>Summary: ${assignment.route.summary}</p>` +
                        `<ol>${assignment.route.legs[0].steps.map(step => `<li>${step.instructions}</li>`).join("")}</ol>`;
                    directionsPanel.appendChild(routeCard);
                });

                if (routes[0].legs[0].start_location) {
                    map.setCenter(routes[0].legs[0].start_location);
                }
            } else {
                alert("Error: Could not calculate routes. Status: " + status);
                console.error("Directions API error:", status, result);
            }
        });
    }
</script>

<!-- Load Google Maps API (replace YOUR_API_KEY with your actual key) -->
<script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBNLCj9I1fRuRAl80gXfCYCmeu68fPRXa8&callback=initMap">
</script>

</body>
</html>
